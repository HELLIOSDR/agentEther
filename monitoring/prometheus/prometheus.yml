# Prometheus Configuration for Spectrum Protocol 2026

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'spectrum-protocol'
    environment: '${ENVIRONMENT:-production}'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "rules/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Node Exporter (system metrics)
  - job_name: 'nodeexporter'
    static_configs:
      - targets: ['nodeexporter:9100']
        labels:
          service: 'node-exporter'

  # cAdvisor (container metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'

  # MCP Gateway
  - job_name: 'mcp-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          service: 'mcp-gateway'
          component: 'api'
    scrape_interval: 10s

  # MCP Gateway Health Check (via blackbox)
  - job_name: 'mcp-gateway-health'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:3000/health
          - https://api.geminiswiss1909.online/health
        labels:
          service: 'mcp-gateway'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: mcp-exporter:9115

  # ChromaDB
  - job_name: 'chromadb'
    static_configs:
      - targets: ['host.docker.internal:8001']
        labels:
          service: 'chromadb'
    scrape_interval: 30s

  # Cloudflare Tunnel Status
  - job_name: 'cloudflare-tunnel'
    static_configs:
      - targets: ['tunnel-exporter:9300']
        labels:
          service: 'cloudflare-tunnel'
    scrape_interval: 60s

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'

  # Docker daemon (if enabled)
  - job_name: 'docker'
    static_configs:
      - targets: ['host.docker.internal:9323']
        labels:
          service: 'docker-daemon'
    scrape_interval: 30s
