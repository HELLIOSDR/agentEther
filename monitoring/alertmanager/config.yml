# AlertManager Configuration for Spectrum Protocol 2026

global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    - match:
        severity: warning
      receiver: 'warning'
    - match:
        service: coordination
      receiver: 'coordination'

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://host.docker.internal:9100/webhook'
        send_resolved: true

  - name: 'critical'
    webhook_configs:
      - url: 'http://host.docker.internal:9100/webhook/critical'
        send_resolved: true
    # Optional: Add Slack, email, PagerDuty, etc.
    # slack_configs:
    #   - channel: '#alerts-critical'
    #     title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  - name: 'warning'
    webhook_configs:
      - url: 'http://host.docker.internal:9100/webhook/warning'
        send_resolved: true

  - name: 'coordination'
    webhook_configs:
      - url: 'http://host.docker.internal:9100/webhook/coordination'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
