# Spectrum Protocol 2026 - Anthropic Cloud Environment Override
# This file extends docker-compose.yml for Anthropic Cloud deployment

version: '3.8'

services:
  mcp-gateway:
    environment:
      # Anthropic Cloud Environment Identifier
      - ENVIRONMENT=anthropic

      # MCP Gateway Configuration
      - NODE_ENV=production
      - MCP_PORT=3000
      - SOCKET_MCP_PORT=3001
      - LOG_LEVEL=info

      # Security Configuration
      - MAX_SCAN_TIMEOUT=300000
      - RATE_LIMIT_REQUESTS=100
      - RATE_LIMIT_WINDOW=60000
      - ENABLE_SOCKET_MCP=true

      # Anthropic Cloud specific hosts
      - ALLOWED_HOSTS=localhost,127.0.0.1,mcp-gateway,geminiswiss1909.online,api.geminiswiss1909.online

      # Tool Configuration
      - NMAP_MAX_HOSTS=256
      - NMAP_MAX_PORTS=1000
      - WHOIS_CACHE_TTL=3600
      - DNS_RESOLVER=8.8.8.8

      # AI Model API Keys
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}

      # ChromaDB Configuration
      - CHROMADB_HOST=host.docker.internal
      - CHROMADB_PORT=8001
      - CHROMADB_COLLECTION=network_archaeology

      # Anthropic Cloud Workspace Configuration
      - WORKSPACE_ID=anthropic-cloud
      - DEPLOYMENT_REGION=us-east

    # Anthropic Cloud resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  cloudflare-tunnel:
    environment:
      # Anthropic Cloud Cloudflare tunnel configuration
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
