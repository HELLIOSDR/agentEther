# Spectrum Protocol 2026 - Anthropic Cloud Environment Override
# This file extends docker-compose.yml for Anthropic Cloud deployment

version: '3.8'

services:
  mcp-gateway:
    environment:
      # Anthropic Cloud specific configuration
      - ENVIRONMENT=anthropic
      - ALLOWED_HOSTS=localhost,127.0.0.1,mcp-gateway,api.geminiswiss1909.online

    # Anthropic Cloud resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  cloudflare-tunnel:
    environment:
      # Anthropic tunnel configuration
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN_ANTHROPIC}
