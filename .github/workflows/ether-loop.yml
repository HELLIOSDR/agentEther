name: Eter Continuous Interaction Loop

on:
  workflow_dispatch:
    inputs:
      max_iterations:
        description: 'Maximum number of iterations'
        required: false
        default: '10'
        type: string
      delay_seconds:
        description: 'Delay between iterations (seconds)'
        required: false
        default: '30'
        type: string

jobs:
  continuous_interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup interaction environment
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl
          echo "ITERATION=0" >> $GITHUB_ENV
          echo "MAX_ITERATIONS=${{ github.event.inputs.max_iterations || '10' }}" >> $GITHUB_ENV
          echo "DELAY_SECONDS=${{ github.event.inputs.delay_seconds || '30' }}" >> $GITHUB_ENV

      - name: Continuous Eter Interaction Loop
        run: |
          # Funkcja do wykonania pojedynczej interakcji
          perform_interaction() {
            local iteration=$1
            echo "=== Iteration $iteration ==="
            
            # Pobierz aktualny stan repozytorium
            git fetch origin
            LAST_COMMIT=$(git log -1 --format="%H %s" main)
            echo "Last commit: $LAST_COMMIT"
            
            # Przygotuj kontekst dla Perplexity
            CONTEXT="Iteration: $iteration\nCurrent time: $(date)\nLast commit: $LAST_COMMIT\nRepository state analysis request."
            
            # Buduj zapytanie JSON
            JSON_PAYLOAD=$(jq -n \
              --arg model "sonar-medium-32k-online" \
              --arg system_prompt "Jestes Eterem - inteligentnym agentem AI monitorujacym repozytorium agentEther. Twoja rola to analiza stanu repozytorium, generowanie insight oraz sugerowanie akcji. Odpowiadaj zwiezle po polsku. Kazda iteracja to nowa perspektywa na projekt." \
              --arg user_prompt "$CONTEXT" \
              '{
                model: $model,
                messages: [
                  {role: "system", content: $system_prompt},
                  {role: "user", content: $user_prompt}
                ]
              }')
            
            # Wywolanie API Perplexity
            if [ -n "${{ secrets.PERPLEXITY_API_KEY }}" ]; then
              RESPONSE=$(curl -s -X POST https://api.perplexity.ai/chat/completions \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${{ secrets.PERPLEXITY_API_KEY }}" \
                -d "$JSON_PAYLOAD")
              
              # Wyodrebnij odpowiedz
              ETER_RESPONSE=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "No response"')
              echo "Eter Response: $ETER_RESPONSE"
              
              # Zapisz do pliku
              TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
              INTERACTION_FILE="interactions/iteration_${iteration}_${TIMESTAMP}.md"
              
              # Utworz katalog jesli nie istnieje
              mkdir -p interactions
              
              # Zapisz interakcje
              cat > "$INTERACTION_FILE" << EOF
# Eter Interaction - Iteration $iteration

**Timestamp:** $(date)
**Commit:** $LAST_COMMIT

## Context
$CONTEXT

## Eter Response
$ETER_RESPONSE

---
*Generated by Eter Continuous Interaction Loop*
EOF
              
              echo "Interaction saved to: $INTERACTION_FILE"
              
            else
              echo "PERPLEXITY_API_KEY not found - simulation mode"
              INTERACTION_FILE="interactions/iteration_${iteration}_$(date +"%Y%m%d_%H%M%S")_sim.md"
              mkdir -p interactions
              
              cat > "$INTERACTION_FILE" << EOF
# Eter Interaction - Iteration $iteration (Simulation)

**Timestamp:** $(date)
**Commit:** $LAST_COMMIT

## Context
$CONTEXT

## Simulated Response
Eter system dziala w trybie symulacji. Monitoruje repozytorium i generuje regularne analizy stanu projektu.

---
*Generated by Eter Continuous Interaction Loop (Simulation Mode)*
EOF
            fi
            
            # Commit zmian jesli sa nowe pliki
            if [ -f "$INTERACTION_FILE" ]; then
              git config --global user.name 'eter-agent[bot]'
              git config --global user.email 'eter-agent[bot]@users.noreply.github.com'
              git add "$INTERACTION_FILE"
              
              if git diff --staged --quiet; then
                echo "No changes to commit"
              else
                git commit -m "Eter interaction iteration $iteration - $(date +"%Y-%m-%d %H:%M:%S")"
                git push origin main
                echo "Changes committed and pushed"
              fi
            fi
          }
          
          # Glowna petla
          while [ $ITERATION -lt $MAX_ITERATIONS ]; do
            ITERATION=$((ITERATION + 1))
            echo "ITERATION=$ITERATION" >> $GITHUB_ENV
            
            perform_interaction $ITERATION
            
            # Sprawdz czy to ostatnia iteracja
            if [ $ITERATION -lt $MAX_ITERATIONS ]; then
              echo "Waiting ${DELAY_SECONDS} seconds before next iteration..."
              sleep $DELAY_SECONDS
            fi
            
            # Sprawdz czas trwania (bezpieczenstwo)
            if [ $ITERATION -ge $MAX_ITERATIONS ]; then
              echo "Maximum iterations reached: $MAX_ITERATIONS"
              break
            fi
          done
          
          echo "Continuous interaction loop completed. Total iterations: $ITERATION"

      - name: Generate summary report
        run: |
          echo "=== Eter Continuous Interaction Summary ==="
          echo "Total iterations: $ITERATION"
          echo "Files created:"
          ls -la interactions/ || echo "No interaction files found"
          
          # Utworz raport podsumowujacy
          SUMMARY_FILE="interactions/summary_$(date +"%Y%m%d_%H%M%S").md"
          cat > "$SUMMARY_FILE" << EOF
# Eter Continuous Interaction Summary

**Run Date:** $(date)
**Total Iterations:** $ITERATION
**Max Iterations:** $MAX_ITERATIONS
**Delay Between Iterations:** $DELAY_SECONDS seconds

## Generated Files
$(ls -la interactions/ | grep -v summary || echo "No files found")

## Workflow Status
Continuous interaction loop completed successfully.

---
*Generated by Eter Continuous Interaction Loop*
EOF
          
          # Commit raportu
          git add "$SUMMARY_FILE"
          git commit -m "Eter interaction summary - $(date +"%Y-%m-%d %H:%M:%S")" || echo "No changes to commit"
          git push origin main || echo "Nothing to push"